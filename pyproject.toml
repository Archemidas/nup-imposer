[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nup-imposer"
version = "0.4.0"
description = "N-up image imposition with ICC color management, printer presets, and multi-ink RIP output"
readme = "README.md"
authors = [{name = "Archemidas"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "psd-tools>=1.10.0",
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.0",
]
rip = [
    "tifffile>=2023.1.1",
    "numpy>=1.24",
]

[project.scripts]
nup-imposer = "nup_imposer.cli:main"

[project.gui-scripts]
nup-imposer-gui = "nup_imposer.gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
