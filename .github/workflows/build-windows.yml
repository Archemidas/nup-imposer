name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0 pytest

      - name: Run tests
        run: pytest tests

      - name: Build single-file EXE
        run: pyinstaller nup_imposer.spec --noconfirm

      - name: Verify build output
        shell: powershell
        run: |
          if (!(Test-Path "dist\NupImposer.exe")) {
            Write-Error "Build failed: dist\NupImposer.exe not found"
            exit 1
          }
          $size = (Get-Item "dist\NupImposer.exe").Length / 1MB
          Write-Host "NupImposer.exe built successfully — $([math]::Round($size,1)) MB"

      - name: Package as zip
        shell: powershell
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$(Get-Date -Format yyyyMMddHHmm)" }
          $zipName = "NupImposer-$tag-Windows.zip"
          # Zip only the single exe so it lands at the root when extracted
          Compress-Archive -Path "dist\NupImposer.exe" -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NupImposer-Windows
          path: ${{ env.ZIP_NAME }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
